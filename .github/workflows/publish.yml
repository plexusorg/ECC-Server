# Builds the Debian package on every push and pull request, and publishes it to Telesphorepo from master (a
# Telesphorepo CI pipeline trusts this file on master; no secret is stored). A push publishes <VERSION>~dev.<run>,
# which telesphorepo.toml sends to ecc-server-dev; Run workflow with "release" publishes <VERSION> to ecc-server.
name: Publish
on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish VERSION as a release to ecc-server
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Version
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          if [[ "${{ inputs.release }}" == "true" ]]; then
            echo "PACKAGE_VERSION=$base" >> "$GITHUB_ENV"
          else
            echo "PACKAGE_VERSION=${base}~dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
      - name: Package
        run: ./package.sh "$PACKAGE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ecc-server-deb
          path: dist/*.deb
      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          curl -fsSL https://telesphorepo.com/install.sh | sh
          telesphorepo publish dist/*.deb
