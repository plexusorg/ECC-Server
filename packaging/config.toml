# ECC-Server configuration. Unknown keys are rejected.

# HTTP address, host:port. Every request needs the token from `sudo ecc-server token`. The default serves Module-ECC
# on the same machine. To serve a game server in a Docker container, set the host's address on that Docker network,
# for example the bridge gateway, "172.17.0.1:8790". Do not expose it beyond the networks that need it.
listen = "127.0.0.1:8790"

# The name of the bundle's hold threshold to serve, such as "2pct" or "1pct", to change how much the fast model holds
# without a new bundle. Empty serves the bundle's default; a name the bundle does not have keeps it from loading.
[model]
threshold = ""

# What the judge may spend, in US dollars, per UTC day and per UTC month. A call that would pass either budget is not
# made: its lines stay held, its session goes to the review queue, and staff with the alert permission are told once
# a day (or month).
[budget]
daily_usd = 25.0
monthly_usd = 250.0
