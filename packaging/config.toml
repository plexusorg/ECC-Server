# ECC-Server configuration. Unknown keys are rejected.

# HTTP address, host:port. Every request needs the token from `sudo ecc-server token`. The default serves Module-ECC
# on the same machine. To serve a game server in a Docker container, set the host's address on that Docker network,
# for example the bridge gateway, "172.17.0.1:8790". Do not expose it beyond the networks that need it.
listen = "127.0.0.1:8790"

# Bundle store, state, chat-safety state and records, and the downloaded llama.cpp release.
data = "/var/lib/ecc-server"

# llama-server's -t.
threads = 6

# Run this llama-server binary instead of downloading the bundle's llama.cpp release.
# llama_server = "/opt/llama/llama-server"

# The W&B artifact whose `production` alias names the bundle to serve. The API key is not set here:
# `sudo ecc-server wandb login` stores it encrypted for the service.
wandb_entity = "telesphoreo-telesphoreo"
wandb_project = "ecc"
wandb_artifact = "classifier-bundle"

# How often the host checks W&B's production alias (at least 1m).
check_interval = "10m"

# The Amazon Bedrock region and model (a model or inference profile ID) the slow check calls. The API key is not set
# here: `sudo ecc-server bedrock login` stores it encrypted for the service.
bedrock_region = "us-east-1"
bedrock_model = "us.moonshotai.kimi-k3"

# This game server's name, written in every record line: 1 to 32 of a-z, 0-9, - and _.
server = "tf"

# How many of a player's messages can wait to be scored; past this, their oldest waiting message is not scored.
queue_size = 20

# A banned player is kicked at a random time in this range after the verdict, and stays muted until then.
kick_delay_min = "2m"
kick_delay_max = "10m"

# After this long of "not sure yet" verdicts, not counting time while Bedrock fails, a player is unmuted with no ban
# (at least 1m).
held_cap = "10m"

# How many days the daily records in <data>/record are kept.
record_retention_days = 180
