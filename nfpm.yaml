name: ecc-server
arch: amd64
platform: linux
# VERSION holds a Debian upstream version; a "~" marks a pre-release (0.1.0~dev.3 sorts before 0.1.0).
version: ${VERSION}
version_schema: none
section: net
priority: optional
maintainer: Telesphoreo <me@telesphoreo.me>
description: |
  Chat-safety decisions for Module-ECC.
  Gives every chat line a verdict before delivery, keeps each player's sitting,
  asks a judge on Amazon Bedrock for a ruling at the sitting's checkpoints within
  a spend budget, keeps the daily record, and tells Module-ECC over
  token-protected HTTP whom to ban or warn and which held lines to deliver.
  Fetches the bundle promoted to production from Weights & Biases, and runs its
  models on the CPU with the OpenVINO runtime it carries. Needs glibc (Debian, Ubuntu).
depends:
  - ca-certificates
  - libc6
  - libstdc++6
contents:
  - src: dist/ecc-server
    dst: /usr/bin/ecc-server
    file_info:
      mode: 0755
  # OpenVINO's runtime (package.sh takes it from OpenVINO's release archive); the server loads it from here.
  - src: dist/openvino/libopenvino.so.2026.4.1
    dst: /usr/lib/ecc-server/openvino/libopenvino.so.2026.4.1
    file_info:
      mode: 0644
  - src: libopenvino.so.2026.4.1
    dst: /usr/lib/ecc-server/openvino/libopenvino.so.2641
    type: symlink
  - src: dist/openvino/libopenvino_c.so.2026.4.1
    dst: /usr/lib/ecc-server/openvino/libopenvino_c.so.2026.4.1
    file_info:
      mode: 0644
  - src: libopenvino_c.so.2026.4.1
    dst: /usr/lib/ecc-server/openvino/libopenvino_c.so.2641
    type: symlink
  - src: dist/openvino/libopenvino_ir_frontend.so.2026.4.1
    dst: /usr/lib/ecc-server/openvino/libopenvino_ir_frontend.so.2026.4.1
    file_info:
      mode: 0644
  - src: libopenvino_ir_frontend.so.2026.4.1
    dst: /usr/lib/ecc-server/openvino/libopenvino_ir_frontend.so.2641
    type: symlink
  - src: dist/openvino/libopenvino_intel_cpu_plugin.so
    dst: /usr/lib/ecc-server/openvino/libopenvino_intel_cpu_plugin.so
    file_info:
      mode: 0644
  - src: dist/openvino/libtbb.so.12.13
    dst: /usr/lib/ecc-server/openvino/libtbb.so.12.13
    file_info:
      mode: 0644
  - src: libtbb.so.12.13
    dst: /usr/lib/ecc-server/openvino/libtbb.so.12
    type: symlink
  - src: packaging/ecc-server.service
    dst: /lib/systemd/system/ecc-server.service
    file_info:
      mode: 0644
  - src: packaging/config.toml
    dst: /etc/ecc-server/config.toml
    type: config|noreplace
    file_info:
      mode: 0644
scripts:
  preinstall: packaging/preinst
  postinstall: packaging/postinst
  preremove: packaging/prerm
  postremove: packaging/postrm
