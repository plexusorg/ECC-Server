name: ecc-server
arch: amd64
platform: linux
# VERSION holds a Debian upstream version; a "~" marks a pre-release (0.1.0~dev.3 sorts before 0.1.0).
version: ${VERSION}
version_schema: none
section: net
priority: optional
maintainer: Telesphoreo <me@telesphoreo.me>
description: |
  Chat-safety decisions for Module-ECC.
  Scores chat with a classifier bundle served by a llama-server child process,
  runs the slow check on Amazon Bedrock, keeps the daily record, and tells
  Module-ECC over loopback HTTP whom to mute, unmute and ban. Fetches the
  bundle promoted to production from Weights & Biases.
depends:
  - libgomp1
  - ca-certificates
contents:
  - src: dist/ecc-server
    dst: /usr/bin/ecc-server
    file_info:
      mode: 0755
  - src: packaging/ecc-server.service
    dst: /lib/systemd/system/ecc-server.service
    file_info:
      mode: 0644
  - src: packaging/config.toml
    dst: /etc/ecc-server/config.toml
    type: config|noreplace
    file_info:
      mode: 0644
scripts:
  preinstall: packaging/preinst
  postinstall: packaging/postinst
  preremove: packaging/prerm
  postremove: packaging/postrm
